<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#059669" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#04110d" media="(prefers-color-scheme: dark)" />
  <title>mitthuai — your Mac's memory, answerable by Claude</title>
  <meta name="description" content="mitthuai (HelloMac) quietly remembers what you read, watch, and work on — then lets Claude search it, remind you to revise, and tell you what's important today. 100% local, private by design." />

  <meta property="og:title" content="mitthuai — your Mac's memory, answerable by Claude" />
  <meta property="og:description" content="A private, on-device memory for your Mac. Ask Claude what you did, what to revise, and what's due today." />
  <meta property="og:type" content="website" />

  <link rel="icon" type="image/svg+xml" href="/parrot.svg" />

  <!-- Set theme before paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('mitthu-theme');
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.setAttribute('data-theme', saved || (prefersLight ? 'light' : 'dark'));
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
